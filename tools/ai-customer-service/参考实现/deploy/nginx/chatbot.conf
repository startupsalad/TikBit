# AI 在线客服机器人 · Nginx 反向代理片段
# 由创业沙拉 TikBit 出品 · https://startupsalad.com
#
# 把下面的 location 块加进你网站已有的 server{} 里（同一个域名的配置文件），
# 然后 nginx -t && nginx -s reload。
#
# 把 guide-api 换成你自己的接口前缀（要与前端 data-api、后端 API_PATH 对得上）。
# 后端由 docker-compose 绑在 127.0.0.1:8770，这里就转发到本机 8770。

location /guide-api/ {
    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # claude CLI 响应可能较慢，放宽超时
    proxy_connect_timeout 10s;
    proxy_read_timeout 70s;

    # 前端 widget 与后端同域（都在本站点下），无需跨域配置；防滥用靠后端限流+每日预算封顶
}


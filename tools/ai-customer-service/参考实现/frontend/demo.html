<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 客服窗口 · 本地预览</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:60px 24px;background:#f5f5f7;color:#1a1a1a;line-height:1.7}
    .wrap{max-width:680px;margin:0 auto}
    h1{font-size:28px}
    .note{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px 24px;margin-top:24px}
    code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 客服窗口 · 本地预览</h1>
    <p>这是一个演示页面，用来看客服窗口的长相。点击右下角 💬 按钮打开聊天窗口。</p>
    <div class="note">
      <p><strong>提示</strong>：本页未连接后端，发送消息会走兜底话术（<code>data-fallback</code>），这是正常的。</p>
      <p>正式使用时，把下面这行 <code>&lt;script&gt;</code> 的 <code>data-api</code> 改成你的真实接口地址，并部署好后端即可。</p>
    </div>
  </div>

  <!-- 演示引入：本地预览用相对路径；正式部署改 data-api 为你的真实接口 -->
  <script src="chatbot-widget.js"
          data-api="/guide-api/ask"
          data-title="在线咨询"
          data-subtitle="本地预览页"
          data-welcome="你好，我是在线答疑助手 👋 这里是本地预览页。"></script>
</body>
</html>
